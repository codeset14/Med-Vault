<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Health Analyzer & Medical Vault</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    h1, h2 {
      color: #2c3e50;
    }
    input {
      display: block;
      margin: 8px 0;
      padding: 8px;
      width: 260px;
    }
    button {
      padding: 8px 16px;
      background: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      margin: 6px 4px 6px 0;
    }
    button:hover {
      background: #2980b9;
    }
    hr {
      margin: 20px 0;
    }
    .record {
      background: white;
      padding: 10px;
      margin-top: 10px;
      border-radius: 5px;
    }
    canvas {
      background: white;
      margin-top: 15px;
      border-radius: 5px;
      padding: 10px;
      max-width: 700px;
    }
    #logoutBtn {
      background: #e74c3c;
    }
  </style>
</head>

<body>

  <h1>Health Analyzer & Medical Vault</h1>

  <!-- 🔐 AUTH SECTION -->
  <h2>Login / Signup</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="signupBtn">Sign Up</button>
  <button id="loginBtn">Login</button>
  <button id="logoutBtn" style="display:none;">Logout</button>

  <hr>

  <!-- 🧾 HEALTH INPUT -->
  <h2>Add Health Record</h2>
  <input id="height" type="number" step="0.01" placeholder="Height (meters)">
  <input id="weight" type="number" step="0.1" placeholder="Weight (kg)">
  <input id="bp_sys" type="number" placeholder="BP Systolic">
  <input id="bp_dia" type="number" placeholder="BP Diastolic">
  <input id="sugar" type="number" placeholder="Sugar level (mg/dL)">
  <button id="saveBtn">Save Record</button>

  <hr>

  <!-- 📊 GRAPHS -->
  <h2>BMI Trend</h2>
  <canvas id="bmiChart" width="600" height="250"></canvas>

  <h2>Blood Pressure Trend</h2>
  <canvas id="bpChart" width="600" height="250"></canvas>

  <h2>Sugar Level Trend</h2>
  <canvas id="sugarChart" width="600" height="250"></canvas>

  <hr>

  <!-- 📤 EXPORT -->
  <h2>Export Health Data</h2>
  <button id="exportCSVBtn">Download Health Data (CSV)</button>

  <hr>

  <!-- 📁 UPLOAD REPORT -->
  <h2>Upload Health Report</h2>
  <input type="file" id="reportFile" accept=".pdf,image/*">
  <button id="uploadBtn">Upload Report</button>
  <div id="uploadStatus"></div>

  <hr>

  <!-- 📂 VIEW REPORTS -->
  <h2>Your Uploaded Reports</h2>
  <div id="reportsList"></div>

  <hr>

  <!-- 📋 RECORD LIST -->
  <h2>Your Health Records</h2>
  <div id="output"></div>

  <!-- 📊 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 🧠 App Logic -->
  <script type="module" src="app.js"></script>

</body>
</html>
