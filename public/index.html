<!DOCTYPE html>


<html lang="en">
  
<head>
  <meta charset="UTF-8" />
  <title>Medical Vault · Secure Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="auth-body">

  <div class="auth-card">
    <h1>Medical Vault</h1>
    <p class="subtext">Private, encrypted access to your health data</p>

    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" />

    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <button id="loginBtn">Sign in</button>
    <button id="signupBtn" class="secondary">Create account</button>

    <p id="authError" class="error"></p>

    <p class="footnote">HIPAA-aware · Encrypted · Private</p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
